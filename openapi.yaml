openapi: 3.0.3
info:
  title: CaumeDSE REST API
  version: 1.0.9
  description: |
    Machine-readable reference for the stable CaumeDSE routes documented in
    README.md and exercised by TEST/run_debug_components.sh. Responses are
    currently HTML, CSV, or JSON-oriented text tables unless a route returns
    only a status code. Responses include an `X-Request-Id` header for log
    correlation. When `outputType=json` is requested and a non-HEAD request
    fails, common errors return a JSON envelope with `error.code`,
    `error.message`, `error.httpStatus`, `error.requestId`, and
    `error.safeForAgent`. JSON table reads support `limit` and `offset`;
    omitted values default to `limit=100` and `offset=0`, with a maximum
    accepted limit of 1000.
servers:
  - url: http://localhost:18080
    description: DEBUG HTTP verifier server
  - url: https://localhost:18443
    description: DEBUG HTTPS verifier server
tags:
  - name: Agent capabilities
  - name: Authentication
  - name: Organizations
  - name: Users
  - name: Roles and filters
  - name: Storage
  - name: Document types
  - name: Documents
  - name: Document content
  - name: Parser scripts
  - name: Secure DB browsing

paths:
  /agentCapabilities:
    get:
      tags: [Agent capabilities]
      summary: Return a public machine-readable manifest for AI agents and MCP clients.
      description: |
        Describes safe automation guidance, supported auth modes, preferred
        response formats, parser policy settings, documentation links, and core
        data routes. This route is intentionally public and does not expose
        organization data or secrets.
      responses:
        "200":
          description: JSON capability manifest.
          content:
            application/json:
              schema:
                type: object
                required: [capabilityManifestVersion, engine, safeForAgents, authentication, routes]
                properties:
                  capabilityManifestVersion:
                    type: integer
                    example: 1
                  engine:
                    type: string
                    example: CaumeDSE
                  safeForAgents:
                    type: boolean
                    example: true
                  authentication:
                    type: object
                  formats:
                    type: object
                  parserPolicy:
                    type: object
                  routes:
                    type: array
                    items:
                      type: object
                  docs:
                    type: array
                    items:
                      type: string
    options:
      tags: [Agent capabilities]
      summary: Return supported methods for the agent capability manifest.
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /organizations:
    get:
      tags: [Organizations]
      summary: List organization resources.
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/orgKey"
        - $ref: "#/components/parameters/outputType"
        - $ref: "#/components/parameters/matchPublicKey"
      responses:
        "200":
          $ref: "#/components/responses/TableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Organizations]
      summary: Update matching organization resources.
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/orgKey"
        - $ref: "#/components/parameters/resourceInfoUpdate"
        - $ref: "#/components/parameters/certificateUpdate"
        - $ref: "#/components/parameters/publicKeyUpdate"
      responses:
        "200":
          $ref: "#/components/responses/TableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Organizations]
      summary: Delete matching organization resources.
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/orgKey"
      responses:
        "200":
          $ref: "#/components/responses/CountResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    head:
      tags: [Organizations]
      summary: Count matching organization resources.
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/orgKey"
      responses:
        "200":
          $ref: "#/components/responses/HeaderOnly"
    options:
      tags: [Organizations]
      summary: Return supported methods for organizations.
      responses:
        "200":
          $ref: "#/components/responses/TextResponse"

  /organizations/{organization}:
    parameters:
