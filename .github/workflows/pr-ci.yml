name: Pull Request CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git diff --name-only "$base" "$head" > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi

          docs_only=1
          if [ ! -s changed-files.txt ]; then
            docs_only=0
          fi
          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*|README*|CHANGELOG.md|TODO.md|TUTORIAL.md|API_EXAMPLES.md|AI_USAGE.md)
                ;;
              *)
                docs_only=0
                ;;
            esac
          done < changed-files.txt

          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'Changed files:\n'
          sed 's/^/  - /' changed-files.txt
          printf 'docs_only=%s\n' "$docs_only"

  lightweight:
    name: Lightweight Checks
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        run: |
          bash -n TEST/run_debug_components.sh
          bash -n TEST/validate_version_bump.sh
          bash -n TEST/test_validate_version_bump.sh

      - name: Validate pull request version impact
        if: github.event_name == 'pull_request'
        env:
          CDSE_VERSION_BASE_REF: ${{ github.event.pull_request.base.sha }}
          CDSE_VERSION_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: TEST/validate_version_bump.sh

      - name: Test pull request version impact validator
        run: TEST/test_validate_version_bump.sh

      - name: Validate immutable workflow action references
        run: TEST/validate_workflow_actions.sh

      - name: Test workflow action policy validator
        run: TEST/test_validate_workflow_actions.sh

      - name: Validate OpenAPI route contract
        run: TEST/validate_openapi_routes.sh

      - name: Validate TODO status format
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^- \[[ x]\] #[0-9]+ ' TODO.md
          python3 -c 'import re; from pathlib import Path; numbers=[int(m.group(1)) for line in Path("TODO.md").read_text(encoding="utf-8").splitlines() for m in [re.match(r"- \[[ x]\] #([0-9]+) ", line)] if m]; assert numbers == sorted(numbers), "TODO items are not sorted by number"; assert len(numbers) == len(set(numbers)), "TODO item numbers contain duplicates"'

  build-and-verify:
    name: Build And Verify
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != '1'
    env:
      CDSE_VERIFY_REDACT: "1"
      CDSE_VERIFY_PREFIX: /tmp/cdse-verify
      CDSE_VERIFY_LOG_DIR: /tmp/cdse-ci-components
      CDSE_DEBUG_TEST_TIMEOUT: 120s
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            curl \
            gawk \
            libcrypt-dev \
            libgnutls28-dev \
            libmicrohttpd-dev \
            libnsl-dev \
            libperl-dev \
            libsqlite3-dev \
            libssl-dev \
            libtool \
            clang \
            perl \
            pkg-config \
            python3

      - name: Refresh generated autotools files
        run: autoreconf -fi

      - name: Configure DEBUG test build
        run: ./configure --prefix=/tmp/cdse-verify --enable-DEBUG --enable-TESTDATABASE --enable-BYPASSTLSAUTHINHTTP

      - name: Clean generated build outputs
        run: make clean

      - name: Build
        run: make V=1

      - name: Run make check
        run: make check

      - name: Run fuzz smoke
        env:
          CDSE_FUZZ_MAX_TOTAL_TIME: "3"
        run: TEST/fuzz/run_fuzz_smoke.sh

      - name: Install DEBUG test build
        run: make install

      - name: Run standalone sample self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 samples/delegated-token-broker/delegated_token_broker.py self-test
          python3 samples/agent-rag-connector/caumedse_rag_connector.py self-test
          python3 samples/review-workspace/review_workspace.py self-test
          python3 samples/audit-dashboard/audit_dashboard.py self-test
          python3 samples/mcp-server/caumedse_mcp_server.py self-test
          python3 samples/policy-authz-tester/policy_authz_tester.py self-test
          python3 samples/encrypted-backup-restore/cdse_backup_restore.py self-test
          python3 samples/reprotect-workflow/reprotect_workflow.py self-test
          python3 samples/operational-readiness/readiness_check.py self-test

      - name: Run component verifier without web sockets
        run: TEST/run_debug_components.sh --skip-build --skip-web

      - name: Try CI web smoke verifier
        id: web_smoke
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cdse-ci-web-smoke
          export CDSE_VERIFY_LOG_DIR=/tmp/cdse-ci-web-smoke
          set +e
          TEST/run_debug_components.sh --live-only --web-protocol=http
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi

          if grep -R -E 'Operation not permitted|could not reserve .* test port|service did not start' /tmp/cdse-ci-web-smoke >/tmp/cdse-ci-web-smoke/socket-denied.txt 2>/dev/null; then
            printf '%s\n' 'CI runner could not create or bind local web sockets; non-web verifier already passed.'
            exit 0
          fi

          printf 'CI web smoke failed for a non-socket-denial reason. Summary follows:\n'
          if [ -f /tmp/cdse-ci-web-smoke/summary.txt ]; then
            cat /tmp/cdse-ci-web-smoke/summary.txt
          fi
          exit "$rc"

      - name: Upload verifier artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caumedse-verifier-logs
          path: |
            /tmp/cdse-ci-components
            /tmp/cdse-ci-web-smoke
          if-no-files-found: ignore
          retention-days: 14

  release-build:
    name: Release Build And Install
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != '1'
    env:
      CDSE_RELEASE_PREFIX: /tmp/cdse-release
      CDSE_RELEASE_STAGE: /tmp/cdse-release-stage
      CDSE_RELEASE_LOG_DIR: /tmp/cdse-ci-release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            gawk \
            libcrypt-dev \
            libgnutls28-dev \
            libmicrohttpd-dev \
            libnsl-dev \
            libperl-dev \
            libsqlite3-dev \
            libssl-dev \
            libtool \
            perl \
            pkg-config

      - name: Refresh generated autotools files
        run: autoreconf -fi

      - name: Verify release rejects HTTP TLS-auth bypass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CDSE_RELEASE_LOG_DIR"
          set +e
          ./configure --prefix="$CDSE_RELEASE_PREFIX" --enable-BYPASSTLSAUTHINHTTP >"$CDSE_RELEASE_LOG_DIR/release-bypass-guard.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && grep -Fq -- "--enable-BYPASSTLSAUTHINHTTP requires --enable-DEBUG" "$CDSE_RELEASE_LOG_DIR/release-bypass-guard.log"; then
            exit 0
          fi
          cat "$CDSE_RELEASE_LOG_DIR/release-bypass-guard.log"
          exit 1

      - name: Configure default release build
        shell: bash
        run: |
          set -euo pipefail
          ./configure --prefix="$CDSE_RELEASE_PREFIX" 2>&1 | tee "$CDSE_RELEASE_LOG_DIR/configure.log"

      - name: Build default release profile
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make V=1 2>&1 | tee "$CDSE_RELEASE_LOG_DIR/build.log"

      - name: Run release check target
        shell: bash
        run: |
          set -euo pipefail
          make check 2>&1 | tee "$CDSE_RELEASE_LOG_DIR/check.log"

      - name: Stage default release installation
        shell: bash
        run: |
          set -euo pipefail
          make install DESTDIR="$CDSE_RELEASE_STAGE" 2>&1 | tee "$CDSE_RELEASE_LOG_DIR/install.log"
          test -x "$CDSE_RELEASE_STAGE$CDSE_RELEASE_PREFIX/cdse/bin/CaumeDSE"

      - name: Validate release source archive
        shell: bash
        run: |
          set -euo pipefail
          make -j2 distcheck 2>&1 | tee "$CDSE_RELEASE_LOG_DIR/distcheck.log"

      - name: Upload release build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caumedse-release-build-logs
          path: /tmp/cdse-ci-release
          if-no-files-found: ignore
          retention-days: 14

  sanitizer-build-and-verify:
    name: Sanitizer Build And Verify
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != '1'
    env:
      CC: clang
      CDSE_VERIFY_REDACT: "1"
      CDSE_VERIFY_PREFIX: /tmp/cdse-sanitize
      CDSE_VERIFY_LOG_DIR: /tmp/cdse-ci-sanitizers
      CDSE_VERIFY_SANITIZERS: address,undefined
      CDSE_DEBUG_TEST_TIMEOUT: 600s
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            clang \
            curl \
            gawk \
            libcrypt-dev \
            libgnutls28-dev \
            libmicrohttpd-dev \
            libnsl-dev \
            libperl-dev \
            libsqlite3-dev \
            libssl-dev \
            libtool \
            perl \
            pkg-config \
            python3

      - name: Refresh generated autotools files
        run: autoreconf -fi

      - name: Configure sanitizer DEBUG test build
        run: ./configure --prefix="$CDSE_VERIFY_PREFIX" --enable-DEBUG --enable-TESTDATABASE --enable-BYPASSTLSAUTHINHTTP --enable-SANITIZERS="$CDSE_VERIFY_SANITIZERS" --disable-HARDENING

      - name: Clean generated build outputs
        run: make clean

      - name: Build with sanitizers
        run: make V=1

      - name: Run make check with sanitizers
        run: make check

      - name: Install sanitizer DEBUG test build
        run: make install

      - name: Run non-web component verifier with sanitizers
        run: TEST/run_debug_components.sh --skip-build --skip-web

      - name: Upload sanitizer verifier artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caumedse-sanitizer-logs
          path: /tmp/cdse-ci-sanitizers
          if-no-files-found: ignore
          retention-days: 14
